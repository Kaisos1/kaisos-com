<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex"/>
<meta name="theme-color" content="#07070f"/>
<meta name="color-scheme" content="dark light"/>
<link rel="icon" type="image/png" href="favicon.png"/>
<link rel="apple-touch-icon" href="Logo.png"/>
<title>404 — Kaisos</title>
<link rel="stylesheet" href="/fonts.css"/>
<link rel="stylesheet" href="/site.css"/>
<style>
html{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}

/* ══ MAIN ══ */
main{flex:1;display:flex;align-items:center;justify-content:center;padding:68px var(--pad) 0;position:relative;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(90px);pointer-events:none}
.blob-1{width:500px;height:500px;background:radial-gradient(circle,rgba(139,63,201,0.15) 0%,transparent 70%);top:-100px;right:-100px}
.blob-2{width:350px;height:350px;background:radial-gradient(circle,rgba(200,133,15,0.07) 0%,transparent 70%);bottom:0;left:-50px}
.inner{position:relative;z-index:1;text-align:center;max-width:520px}
.code{font-family:'Cormorant Garamond',serif;font-size:clamp(6rem,18vw,10rem);font-weight:400;color:var(--surface);line-height:1;letter-spacing:-0.02em;margin-bottom:-1rem;user-select:none}
.code em{color:var(--accent);font-style:normal}
h1{font-family:'Cormorant Garamond',serif;font-size:clamp(1.6rem,4vw,2.4rem);font-weight:400;color:var(--white);margin-bottom:1rem;line-height:1.15}
h1 em{font-style:italic;color:var(--muted2)}
p{color:var(--muted2);font-size:0.97rem;line-height:1.85;margin-bottom:2.5rem}
.actions{display:flex;gap:0.85rem;flex-wrap:wrap;justify-content:center}
.btn-home{display:inline-flex;align-items:center;gap:0.5rem;padding:0.85rem 2rem;background:var(--accent);color:#fff;font-size:0.78rem;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;border-radius:3px;transition:opacity 0.2s}
.btn-home:hover{opacity:0.85}
.btn-music{display:inline-flex;align-items:center;gap:0.5rem;padding:0.85rem 2rem;border:1px solid rgba(139,63,201,0.4);color:var(--muted2);font-size:0.78rem;letter-spacing:0.08em;text-transform:uppercase;border-radius:3px;transition:all 0.2s}
.btn-music:hover{border-color:var(--accent);color:var(--text)}

/* ══ FOOTER ══ */
footer{border-top:1px solid var(--border);padding:1.5rem var(--pad);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem}
.footer-logo{font-family:'Cormorant Garamond',serif;font-size:1rem;color:var(--gold)}
.footer-copy{font-size:0.72rem;color:var(--muted);opacity:0.5}
</style>
</head>
<body>

<nav>
  <a href="/" class="nav-logo">Kaisos</a>
</nav>

<main>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="inner">
    <div class="code">4<em>0</em>4</div>
    <h1>Lost in the <em>lo-fi world.</em></h1>
    <p>This page doesn't exist — but the music does. Head back and find what you were looking for.</p>
    <div class="actions">
      <a href="/" class="btn-home">← Back to kaisos.com</a>
      <a href="/music" class="btn-music">Browse the music</a>
    </div>
  </div>
</main>

<footer>
  <div class="footer-logo">Kaisos</div>
  <span class="footer-copy">© 2026 Kaisos. All rights reserved.</span>
</footer>

</body>
</html>
